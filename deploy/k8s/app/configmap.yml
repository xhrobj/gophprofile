apiVersion: v1
kind: ConfigMap
metadata:
  name: gophprofile-config
  namespace: gophprofile
data:
  S3_ENDPOINT: minio:9000
  S3_BUCKET: avatars
  S3_USE_SSL: "false"
  RABBITMQ_EXCHANGE: avatars.exchange
  RABBITMQ_QUEUE: avatars.processing
  TRACING_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  HTTP_ADDRESS: :8080
  MAX_UPLOAD_SIZE: "10485760"
  WORKER_METRICS_ADDRESS: :9092
  SHUTDOWN_TIMEOUT: 10s
  LOG_LEVEL: info
