apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: gophprofile
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: gophprofile-migrate:local
          imagePullPolicy: Never
          env:
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: gophprofile-secrets
                  key: DATABASE_DSN
