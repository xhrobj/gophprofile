apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  namespace: gophprofile
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 9092
      targetPort: metrics
      protocol: TCP
