x-app-environment: &app-environment
  DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  S3_USE_SSL: "false"
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
  RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
  TRACING_ENABLED: ${TRACING_ENABLED}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT}
  LOG_LEVEL: ${LOG_LEVEL}

services:
  migrate:
    build:
      context: .
      target: migrate
    image: gophprofile-migrate:local
    environment:
      DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      target: server
    image: gophprofile-server:local
    container_name: gophprofile-server
    environment:
      <<: *app-environment
      HTTP_ADDRESS: :8080
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}
    labels:
      gophprofile.logs: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 30s

  worker:
    build:
      context: .
      target: worker
    image: gophprofile-worker:local
    container_name: gophprofile-worker
    environment:
      <<: *app-environment
      WORKER_METRICS_ADDRESS: :9092
    labels:
      gophprofile.logs: "true"
    ports:
      - "127.0.0.1:9092:9092"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 30s

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: gophprofile-jaeger
    profiles:
      - observability
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: gophprofile-prometheus
    profiles:
      - observability
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: gophprofile-alertmanager
    profiles:
      - observability
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:9093/-/healthy || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.7.3
    container_name: gophprofile-loki
    profiles:
      - observability
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    healthcheck:
      test:
        - CMD
        - /usr/bin/loki
        - -health
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 5

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: gophprofile-alloy
    profiles:
      - observability
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.1.1
    container_name: gophprofile-grafana
    profiles:
      - observability
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      jaeger:
        condition: service_started
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17.10
    container_name: gophprofile-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: gophprofile-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:9000/minio/health/live || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.4-management
    container_name: gophprofile-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
