global:
  scrape_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gophprofile-server
    static_configs:
      - targets:
          - server:8080
        labels:
          service: server

  - job_name: gophprofile-worker
    static_configs:
      - targets:
          - worker:9092
        labels:
          service: worker

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq:15692

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
    static_configs:
      - targets:
          - rabbitmq:15692
